<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理您的 hg 账号 · hg 帮助</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #FFFFFF; --text: #1F1F1F; --text-sub: #444746; --border: #E0E0E0; 
            --primary: #0b57d0; 
            --surface: #F8F9FA;
        }
        @media (prefers-color-scheme: dark) { 
            :root { 
                --bg: #131314; --text: #E3E3E3; --text-sub: #C4C7C5; --border: #444746; 
                --primary: #A8C7FA; 
                --surface: #1E1F20;
            } 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', 'Noto Sans SC', sans-serif; line-height: 1.8; }
        a { text-decoration: none; color: var(--primary); font-weight: 500; }
        a:hover { text-decoration: underline; }
        
        /* 顶部导航 */
        .top-nav { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); }
        .nav-left a { color: var(--text-sub); display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
        
        /* 主体内容 */
        .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px 24px; }
        h1 { font-size: 32px; font-weight: 400; margin-bottom: 32px; color: var(--text); }
        
        p { font-size: 16px; color: var(--text-sub); margin-bottom: 20px; }
        
        /* 卡片式链接框 */
        .link-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: border-color 0.2s;
        }
        .link-card:hover { border-color: var(--primary); }
        .link-card .icon { font-size: 32px; color: var(--primary); }
        .link-card .content h3 { font-size: 18px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
        .link-card .content p { margin-bottom: 0; font-size: 15px; }
        
        /* 次要链接区 */
        .related-section { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
        .related-section h2 { font-size: 18px; font-weight: 500; margin-bottom: 16px; color: var(--text); }
        .related-section ul { margin-left: 24px; color: var(--text-sub); }
        .related-section li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="nav-left">
            <a href="../../"><span class="material-symbols-outlined">arrow_back</span> 返回账号帮助</a>
        </div>
    </header>
    
    <main class="container">
        <h1>管理您的 hg 账号</h1>

        <p>在 hg 的网页中，我们提供了一个统一的账号管理页面。您可以在该页面修改个人信息、开启 2FA、或退出登录。</p>

        <!-- 链接卡片 -->
        <a href="https://hg1.dpdns.org/account" class="link-card">
            <span class="material-symbols-outlined icon">account_circle</span>
            <div class="content">
                <h3>前往 hg 账号中心</h3>
                <p>hg1.dpdns.org/account</p>
            </div>
        </a>

        <p>如果您还没有账号，您可以点击此链接前往登录页，并在那里注册一个全新的 hg 账号。</p>

        <!-- 相关阅读 -->
        <div class="related-section">
            <h2>相关阅读</h2>
            <ul>
                <li><a href="../what-is-hg/">hg 账号是什么？</a></li>
            </ul>
        </div>

    </main>
</body>
</html>
