<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建 hg 账号 ·  hg 帮助</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FFFFFF; --text: #1F1F1F; --text-sub: #444746; --border: #E0E0E0; --primary: #0b57d0; }
        @media (prefers-color-scheme: dark) { :root { --bg: #131314; --text: #E3E3E3; --text-sub: #C4C7C5; --border: #444746; --primary: #A8C7FA; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', 'Noto Sans SC', sans-serif; line-height: 1.8; }
        a { text-decoration: none; color: inherit; }
        .top-nav { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); }
        .nav-left a { color: var(--text-sub); display: flex; align-items: center; gap: 8px; font-size: 15px;}
        .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px 24px; }
        h1 { font-size: 32px; font-weight: 500; margin-bottom: 16px; color: var(--text); }
        h2 { font-size: 22px; font-weight: 500; margin: 32px 0 16px; }
        p { font-size: 16px; color: var(--text-sub); margin-bottom: 16px; }
        ul { margin-left: 24px; margin-bottom: 16px; color: var(--text-sub); }
        .update-date { font-size: 14px; color: var(--text-sub); margin-bottom: 32px; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="nav-left">
            <!-- 这里的 ../ 会退回上一级目录 -->
            <a href="../"><span class="material-symbols-outlined">arrow_back</span> 返回</a>
        </div>
    </header>
    <main class="container">
        <h1>创建 hg 账号 ·  hg 帮助</h1>
        <div class="update-date">最后更新：2026年11月</div>

        <p>hg1.dpdns.org/account</p>

        <h2>点击上方链接即可跳转至注册页面</h2>
    </main>
</body>
</html>
