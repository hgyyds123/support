<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交工单 · hg 支持</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FFFFFF; --text: #1F1F1F; --text-sub: #444746; --border: #E0E0E0; --primary: #0b57d0; --surface: #F8F9FA; --green-bg: #188038; --green-hover: #11632a; --red: #c5221f; }
        @media (prefers-color-scheme: dark) { :root { --bg: #131314; --text: #E3E3E3; --text-sub: #C4C7C5; --border: #444746; --primary: #A8C7FA; --surface: #1E1F20; --green-bg: #0D652D; --green-hover: #084d21; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', 'Noto Sans SC', sans-serif; line-height: 1.8; }
        a { text-decoration: none; color: var(--primary); }
        a:hover { text-decoration: underline; }
        .top-nav { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); }
        .nav-left { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
        .nav-left a { color: var(--text-sub); display: flex; align-items: center; gap: 8px; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }
        h1 { font-size: 32px; font-weight: 400; margin-bottom: 8px; color: var(--text); }
        .subtitle { color: var(--text-sub); font-size: 16px; margin-bottom: 32px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
        .form-group label .required { color: var(--red); margin-left: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--primary);
        }
        .form-group textarea { min-height: 160px; resize: vertical; }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 32px; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s, opacity 0.2s; }
        .btn-primary { background: var(--green-bg); color: #fff !important; }
        .btn-primary:hover { background: var(--green-hover); text-decoration: none; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { padding: 16px 20px; border-radius: 8px; margin-bottom: 24px; font-size: 15px; }
        .alert-success { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .alert-error { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
        .alert-info { background: var(--surface); color: var(--text-sub); border: 1px solid var(--border); }
        @media (prefers-color-scheme: dark) {
            .alert-success { background: #1e3a1e; color: #81c995; border-color: #2e4d2e; }
            .alert-error { background: #3e1e1e; color: #f28b82; border-color: #5e2e2e; }
        }
        .user-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 14px; color: var(--text-sub); }
        .user-badge .icon { font-size: 18px; color: var(--primary); }
        .hint { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        .char-count { text-align: right; font-size: 13px; color: var(--text-sub); margin-top: 4px; }
        .divider { height: 1px; background: var(--border); margin: 32px 0; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--text-sub); margin-bottom: 24px; }
        .back-link:hover { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>
    <header class="top-nav">
        <div class="nav-left">
            <a href="/"><span class="material-symbols-outlined">arrow_back</span> 返回帮助中心</a>
        </div>
    </header>
    <main class="container">
        <a href="/" class="back-link"><span class="material-symbols-outlined">arrow_back</span> 返回帮助中心</a>
        <h1>提交工单</h1>
        <p class="subtitle">遇到无法解决的问题？填写下面的表单，站长会在 24 小时内回复。</p>

        <!-- 用户信息显示 -->
        <div id="userInfo" class="user-badge" style="margin-bottom: 24px;">
            <span class="material-symbols-outlined icon">account_circle</span>
            <span>当前用户：<strong id="currentUser">检测中...</strong></span>
        </div>

        <!-- 提示信息 -->
        <div id="alertBox" style="display: none;"></div>

        <form id="ticketForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="title">标题<span class="required">*</span></label>
                    <input type="text" id="title" name="title" placeholder="一句话概括您的问题" maxlength="100" required>
                    <div class="hint">例如：登录时提示 400 错误，清除缓存后仍无法登录</div>
                </div>
                <div class="form-group">
                    <label for="category">分类<span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="">请选择分类</option>
                        <option value="account">账号与登录</option>
                        <option value="safe_2fa">安全与 2FA</option>
                        <option value="talkroom">聊天室</option>
                        <option value="internet">网络与技术</option>
                        <option value="community">社区规范</option>
                        <option value="other">其他问题</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="description">问题描述<span class="required">*</span></label>
                <textarea id="description" name="description" placeholder="请详细描述您遇到的问题，包括：
- 问题发生的具体时间和场景
- 完整的错误提示或截图
- 您已经尝试过哪些方法
- 使用的浏览器、设备和网络环境" required></textarea>
                <div class="char-count"><span id="charCount">0</span> 字</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="contact">联系邮箱<span class="required">*</span></label>
                    <input type="email" id="contact" name="contact" placeholder="用于接收回复通知" required>
                    <div class="hint">站长回复时会通知此邮箱</div>
                </div>
                <div class="form-group">
                    <label for="priority">优先级</label>
                    <select id="priority" name="priority">
                        <option value="normal">普通</option>
                        <option value="high">紧急（账号被盗、无法登录等）</option>
                        <option value="low">低（建议、反馈）</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="attachment">附件链接（可选）</label>
                <input type="url" id="attachment" name="attachment" placeholder="https://example.com/screenshot.png">
                <div class="hint">可以粘贴截图的外链，便于站长查看问题细节</div>
            </div>

            <div class="divider"></div>

            <button type="submit" id="submitBtn" class="btn btn-primary">
                <span class="material-symbols-outlined">send</span> 提交工单
            </button>
        </form>
    </main>

    <script>
        // ========== 配置 ==========
        const SUPABASE_URL = 'https://xxx.supabase.co'; // TODO: 替换为你的 Supabase URL
        const SUPABASE_KEY = 'xxx'; // TODO: 替换为你的 anon key

        // ========== Cookie 鉴权 ==========
        // 从跨子域 cookie 中读取 hg_user_name
        // hg1.dpdns.org 登录时需设置: document.cookie = "hg_user_name=hg; domain=.hg1.dpdns.org; path=/; Secure; SameSite=Lax"
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return null;
        }

        function getCurrentUser() {
            const userName = getCookie('hg_user_name');
            if (userName === 'hg') {
                return { name: userName, role: 'user' };
            }
            return null;
        }

        // ========== 初始化 ==========
        const user = getCurrentUser();
        const userEl = document.getElementById('currentUser');
        if (user) {
            userEl.textContent = user.name;
        } else {
            userEl.textContent = '未登录（仅 hg 用户可提交）';
            document.getElementById('submitBtn').disabled = true;
            showAlert('info', '您尚未登录 hg 账号。请先在 <a href="https://hg1.dpdns.org/account/login/">hg1.dpdns.org</a> 登录后再提交工单。');
        }

        // ========== 工具函数 ==========
        function showAlert(type, message) {
            const box = document.getElementById('alertBox');
            box.className = 'alert alert-' + type;
            box.innerHTML = message;
            box.style.display = 'block';
            box.scrollIntoView({ behavior: 'smooth' });
        }

        function hideAlert() {
            const box = document.getElementById('alertBox');
            box.style.display = 'none';
        }

        // 字数统计
        document.getElementById('description').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });

        // ========== 提交工单 ==========
        document.getElementById('ticketForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideAlert();

            const formData = {
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value,
                description: document.getElementById('description').value.trim(),
                contact: document.getElementById('contact').value.trim(),
                priority: document.getElementById('priority').value,
                attachment: document.getElementById('attachment').value.trim() || null,
                user_name: user ? user.name : null,
                status: 'open',
                created_at: new Date().toISOString()
            };

            // 验证
            if (!formData.title || !formData.description || !formData.contact || !formData.category) {
                showAlert('error', '请填写所有必填字段。');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined">hourglass_top</span> 提交中...';

            try {
                // 通过 Supabase REST API 插入
                const response = await fetch(`${SUPABASE_URL}/rest/v1/tickets`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok || response.status === 201) {
                    showAlert('success', '✅ 工单提交成功！站长会在 24 小时内回复。您的工单编号已记录，可截图保存。');
                    document.getElementById('ticketForm').reset();
                    document.getElementById('charCount').textContent = '0';
                } else {
                    const error = await response.text();
                    showAlert('error', '❌ 提交失败：' + error + '。请稍后重试或直接邮件联系 info@hg1.dpdns.org。');
                }
            } catch (err) {
                showAlert('error', '❌ 网络错误：' + err.message + '。请检查网络后重试。');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="material-symbols-outlined">send</span> 提交工单';
            }
        });
    </script>
</body>
</html>
