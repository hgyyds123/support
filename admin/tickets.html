<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单管理 · hg 管理后台</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FFFFFF; --text: #1F1F1F; --text-sub: #444746; --border: #E0E0E0; --primary: #0b57d0; --surface: #F8F9FA; --green-bg: #188038; --red: #c5221f; --amber: #b06000; }
        @media (prefers-color-scheme: dark) { :root { --bg: #131314; --text: #E3E3E3; --text-sub: #C4C7C5; --border: #444746; --primary: #A8C7FA; --surface: #1E1F20; --green-bg: #0D652D; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', 'Noto Sans SC', sans-serif; line-height: 1.8; }
        a { text-decoration: none; color: var(--primary); }
        a:hover { text-decoration: underline; }

        /* 登录遮罩 */
        .login-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .login-card { width: 100%; max-width: 380px; padding: 32px; }
        .login-card h1 { font-size: 24px; font-weight: 400; text-align: center; margin-bottom: 8px; }
        .login-card .subtitle { text-align: center; color: var(--text-sub); font-size: 14px; margin-bottom: 32px; }
        .login-card input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 16px; }
        .login-card input:focus { outline: none; border-color: var(--primary); }
        .login-card .btn { width: 100%; }
        .login-error { color: var(--red); font-size: 14px; margin-bottom: 16px; display: none; }

        /* 管理界面 */
        .admin-container { display: none; }
        .top-nav { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); }
        .nav-left { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
        .nav-left a { color: var(--text-sub); display: flex; align-items: center; gap: 8px; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .btn-logout { background: none; border: none; cursor: pointer; color: var(--text-sub); font-size: 14px; display: flex; align-items: center; gap: 4px; }
        .btn-logout:hover { color: var(--red); }

        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 24px; }

        /* 统计卡片 */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .stat-card .num { font-size: 28px; font-weight: 500; color: var(--primary); }
        .stat-card .label { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        /* 筛选栏 */
        .filter-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-bar select, .filter-bar input {
            padding: 8px 14px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit;
        }
        .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--primary); }

        /* 工单列表 */
        .ticket-list { display: flex; flex-direction: column; gap: 8px; }
        .ticket-item {
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px 20px; cursor: pointer; transition: border-color 0.2s;
        }
        .ticket-item:hover { border-color: var(--primary); }
        .ticket-item .ti-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .ticket-item .ti-status { font-size: 12px; padding: 2px 10px; border-radius: 12px; font-weight: 500; white-space: nowrap; }
        .status-open { background: #e8f0fe; color: #0b57d0; }
        .status-replied { background: #e6f4ea; color: #137333; }
        .status-closed { background: #f1f3f4; color: #5f6368; }
        .ticket-item .ti-title { font-size: 15px; font-weight: 500; color: var(--text); flex: 1; }
        .ticket-item .ti-priority { font-size: 12px; font-weight: 500; }
        .priority-high { color: var(--red); }
        .priority-normal { color: var(--text-sub); }
        .priority-low { color: var(--amber); }
        .ticket-item .ti-meta { font-size: 13px; color: var(--text-sub); display: flex; gap: 16px; }
        .ticket-item .ti-preview { font-size: 13px; color: var(--text-sub); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 600px; }

        /* 工单详情弹窗 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 9998; display: none; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; background: var(--bg); border-radius: 12px; z-index: 9999; display: none; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 1; }
        .modal-header h2 { font-size: 18px; font-weight: 500; }
        .modal-close { background: none; border: none; cursor: pointer; font-size: 24px; color: var(--text-sub); }
        .modal-body { padding: 24px; }
        .modal-body .field { margin-bottom: 16px; }
        .modal-body .field-label { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
        .modal-body .field-value { font-size: 15px; color: var(--text); }
        .modal-body .description { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; white-space: pre-wrap; word-break: break-word; }
        .modal-footer { display: flex; gap: 12px; padding: 20px 24px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: var(--bg); }
        .modal-footer .btn { flex: 1; }
        .reply-section { margin-top: 20px; }
        .reply-section label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .reply-section textarea { width: 100%; min-height: 100px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 15px; resize: vertical; }
        .reply-section textarea:focus { outline: none; border-color: var(--primary); }

        /* 按钮 */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: #fff !important; }
        .btn-primary:hover { opacity: 0.9; text-decoration: none; }
        .btn-success { background: var(--green-bg); color: #fff !important; }
        .btn-danger { background: var(--red); color: #fff !important; }
        .btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background: var(--surface); text-decoration: none; }

        /* 空状态 */
        .empty-state { text-align: center; padding: 60px 24px; color: var(--text-sub); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        /* 响应式 */
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .modal { width: 95%; }
        }
    </style>
</head>
<body>
    <!-- 登录遮罩 -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h1>hg 工单管理后台</h1>
            <div class="subtitle">请输入管理员密码以继续</div>
            <div id="loginError" class="login-error">密码错误，请重试。</div>
            <input type="password" id="adminPassword" placeholder="管理员密码" autofocus>
            <button class="btn btn-primary" id="loginBtn" onclick="handleLogin()">登录</button>
        </div>
    </div>

    <!-- 管理界面 -->
    <div id="adminContainer" class="admin-container">
        <header class="top-nav">
            <div class="nav-left">
                <a href="/"><span class="material-symbols-outlined">arrow_back</span> 返回前台</a>
            </div>
            <div class="nav-right">
                <button class="btn-logout" onclick="handleLogout()"><span class="material-symbols-outlined">logout</span> 退出</button>
            </div>
        </header>

        <main class="container">
            <h1>工单管理</h1>

            <!-- 统计 -->
            <div class="stats">
                <div class="stat-card"><div class="num" id="statOpen">0</div><div class="label">待处理</div></div>
                <div class="stat-card"><div class="num" id="statReplied">0</div><div class="label">已回复</div></div>
                <div class="stat-card"><div class="num" id="statClosed">0</div><div class="label">已关闭</div></div>
                <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">总计</div></div>
            </div>

            <!-- 筛选 -->
            <div class="filter-bar">
                <select id="filterStatus" onchange="renderList()">
                    <option value="">全部状态</option>
                    <option value="open">待处理</option>
                    <option value="replied">已回复</option>
                    <option value="closed">已关闭</option>
                </select>
                <select id="filterCategory" onchange="renderList()">
                    <option value="">全部分类</option>
                    <option value="account">账号与登录</option>
                    <option value="safe_2fa">安全与 2FA</option>
                    <option value="talkroom">聊天室</option>
                    <option value="internet">网络与技术</option>
                    <option value="community">社区规范</option>
                    <option value="other">其他</option>
                </select>
                <input type="text" id="searchInput" placeholder="搜索关键词..." oninput="renderList()">
                <button class="btn btn-secondary" onclick="loadTickets()"><span class="material-symbols-outlined">refresh</span> 刷新</button>
            </div>

            <!-- 工单列表 -->
            <div id="ticketList" class="ticket-list"></div>
        </main>
    </div>

    <!-- 详情弹窗 -->
    <div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
    <div id="ticketModal" class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">工单详情</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="updateStatus('closed')" id="btnClose">关闭工单</button>
            <button class="btn btn-primary" onclick="sendReply()" id="btnReply"><span class="material-symbols-outlined">reply</span> 发送回复</button>
        </div>
    </div>

    <script>
        // ========== 配置 ==========
        const ADMIN_PASSWORD = 'hg_admin_2024'; // TODO: 请修改为你自己的管理员密码
        const SUPABASE_URL = 'https://xxx.supabase.co'; // TODO: 替换为你的 Supabase URL
        const SUPABASE_KEY = 'xxx'; // TODO: 替换为你的 anon key
        const SESSION_KEY = 'hg_admin_session';

        let allTickets = [];
        let currentTicket = null;

        // ========== 鉴权 ==========
        function isLoggedIn() {
            return sessionStorage.getItem(SESSION_KEY) === 'ok';
        }

        function handleLogin() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === ADMIN_PASSWORD) {
                sessionStorage.setItem(SESSION_KEY, 'ok');
                showAdmin();
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
        }

        function handleLogout() {
            sessionStorage.removeItem(SESSION_KEY);
            location.reload();
        }

        function showAdmin() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            loadTickets();
        }

        // 回车登录
        document.getElementById('adminPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        // ========== 加载工单 ==========
        async function loadTickets() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/tickets?select=*&order=created_at.desc`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (response.ok) {
                    allTickets = await response.json();
                    updateStats();
                    renderList();
                } else {
                    console.error('Failed to load tickets');
                }
            } catch (err) {
                console.error('Network error:', err);
                // 演示模式：使用示例数据
                allTickets = getDemoTickets();
                updateStats();
                renderList();
            }
        }

        // ========== 统计 ==========
        function updateStats() {
            document.getElementById('statOpen').textContent = allTickets.filter(t => t.status === 'open').length;
            document.getElementById('statReplied').textContent = allTickets.filter(t => t.status === 'replied').length;
            document.getElementById('statClosed').textContent = allTickets.filter(t => t.status === 'closed').length;
            document.getElementById('statTotal').textContent = allTickets.length;
        }

        // ========== 渲染列表 ==========
        function renderList() {
            const status = document.getElementById('filterStatus').value;
            const category = document.getElementById('filterCategory').value;
            const search = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allTickets.filter(t => {
                if (status && t.status !== status) return false;
                if (category && t.category !== category) return false;
                if (search && !t.title.toLowerCase().includes(search) && !t.description.toLowerCase().includes(search)) return false;
                return true;
            });

            const list = document.getElementById('ticketList');
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined icon">inbox</span><p>暂无工单</p></div>';
                return;
            }

            list.innerHTML = filtered.map(t => `
                <div class="ticket-item" onclick="openModal('${t.id}')">
                    <div class="ti-header">
                        <span class="ti-status status-${t.status}">${statusLabel(t.status)}</span>
                        <span class="ti-title">${escapeHtml(t.title)}</span>
                        <span class="ti-priority priority-${t.priority || 'normal'}">${priorityLabel(t.priority)}</span>
                    </div>
                    <div class="ti-meta">
                        <span>👤 ${escapeHtml(t.user_name || '匿名')}</span>
                        <span>📂 ${categoryLabel(t.category)}</span>
                        <span>🕐 ${formatTime(t.created_at)}</span>
                    </div>
                    <div class="ti-preview">${escapeHtml(t.description.substring(0, 100))}${t.description.length > 100 ? '...' : ''}</div>
                </div>
            `).join('');
        }

        // ========== 打开详情 ==========
        function openModal(id) {
            currentTicket = allTickets.find(t => t.id === id);
            if (!currentTicket) return;

            const t = currentTicket;
            document.getElementById('modalTitle').textContent = '工单 #' + id.slice(0, 8);
            document.getElementById('modalBody').innerHTML = `
                <div class="field">
                    <div class="field-label">标题</div>
                    <div class="field-value">${escapeHtml(t.title)}</div>
                </div>
                <div style="display:flex;gap:24px;margin-bottom:16px;">
                    <div class="field"><div class="field-label">分类</div><div class="field-value">${categoryLabel(t.category)}</div></div>
                    <div class="field"><div class="field-label">优先级</div><div class="field-value priority-${t.priority || 'normal'}">${priorityLabel(t.priority)}</div></div>
                    <div class="field"><div class="field-label">状态</div><div class="field-value"><span class="ti-status status-${t.status}">${statusLabel(t.status)}</span></div></div>
                </div>
                <div class="field">
                    <div class="field-label">提交用户</div>
                    <div class="field-value">${escapeHtml(t.user_name || '匿名')}</div>
                </div>
                <div class="field">
                    <div class="field-label">联系邮箱</div>
                    <div class="field-value">${escapeHtml(t.contact)}</div>
                </div>
                <div class="field">
                    <div class="field-label">提交时间</div>
                    <div class="field-value">${formatTime(t.created_at)}</div>
                </div>
                ${t.attachment ? `<div class="field"><div class="field-label">附件</div><div class="field-value"><a href="${t.attachment}" target="_blank">${escapeHtml(t.attachment)}</a></div></div>` : ''}
                <div class="field">
                    <div class="field-label">问题描述</div>
                    <div class="description">${escapeHtml(t.description)}</div>
                </div>
                ${t.reply ? `
                <div class="field">
                    <div class="field-label">已有回复</div>
                    <div class="description" style="background:#e8f0fe;">${escapeHtml(t.reply)}</div>
                </div>` : ''}
                <div class="reply-section">
                    <label for="replyText">${t.reply ? '追加回复' : '回复'}</label>
                    <textarea id="replyText" placeholder="输入回复内容..."></textarea>
                </div>
            `;

            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('ticketModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('ticketModal').style.display = 'none';
            currentTicket = null;
        }

        // ========== 发送回复 ==========
        async function sendReply() {
            const text = document.getElementById('replyText').value.trim();
            if (!text) { alert('请输入回复内容'); return; }
            if (!currentTicket) return;

            const replyData = {
                reply: text,
                status: 'replied',
                replied_at: new Date().toISOString()
            };

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/tickets?id=eq.${currentTicket.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify(replyData)
                });

                if (response.ok) {
                    // 更新本地数据
                    Object.assign(currentTicket, replyData);
                    renderList();
                    updateStats();
                    closeModal();
                    alert('回复已发送！');
                } else {
                    alert('发送失败，请重试。');
                }
            } catch (err) {
                // 演示模式：直接更新本地
                Object.assign(currentTicket, replyData);
                renderList();
                updateStats();
                closeModal();
                alert('回复已发送（演示模式）！');
            }
        }

        // ========== 更新状态 ==========
        async function updateStatus(newStatus) {
            if (!currentTicket) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/tickets?id=eq.${currentTicket.id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    Object.assign(currentTicket, { status: newStatus });
                    renderList();
                    updateStats();
                    closeModal();
                } else {
                    alert('操作失败，请重试。');
                }
            } catch (err) {
                Object.assign(currentTicket, { status: newStatus });
                renderList();
                updateStats();
                closeModal();
            }
        }

        // ========== 工具函数 ==========
        function statusLabel(s) { return {open:'待处理',replied:'已回复',closed:'已关闭'}[s] || s; }
        function priorityLabel(p) { return {high:'紧急',normal:'普通',low:'低'}[p] || '普通'; }
        function categoryLabel(c) { return {account:'账号与登录',safe_2fa:'安全与2FA',talkroom:'聊天室',internet:'网络与技术',community:'社区规范',other:'其他'}[c] || c; }
        function formatTime(iso) {
            const d = new Date(iso);
            return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        function escapeHtml(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // 演示数据
        function getDemoTickets() {
            return [
                {id:'demo-001',title:'登录时提示400错误',category:'account',description:'在Edge浏览器登录时总是提示400 Bad Request，清除缓存后仍然无法登录。',contact:'user@example.com',priority:'high',status:'open',user_name:'hg_user',created_at:new Date(Date.now()-3600000).toISOString()},
                {id:'demo-002',title:'AI生成的图片无法显示',category:'talkroom',description:'在聊天室召唤AI后，AI回复的图片一直显示裂图，刷新无效。',contact:'user2@example.com',priority:'normal',status:'replied',user_name:'hg_admin',created_at:new Date(Date.now()-7200000).toISOString(),reply:'请尝试清除缓存或使用无痕模式打开。'},
                {id:'demo-003',title:'建议增加搜索功能',category:'other',description:'希望帮助中心能增加全文搜索，方便查找问题。',contact:'user3@example.com',priority:'low',status:'closed',user_name:'hg_user2',created_at:new Date(Date.now()-86400000).toISOString(),reply:'感谢建议，已加入计划。'}
            ];
        }

        // ========== 启动 ==========
        if (isLoggedIn()) {
            showAdmin();
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('adminPassword').focus();
        }
    </script>
</body>
</html>
