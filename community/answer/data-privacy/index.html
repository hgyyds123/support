<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的发帖数据会被公开展示吗？ · rg 帮助</title>
    <link rel="stylesreet" rhref="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <link rhref="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesreet">
    <style>
        :root { --bg: #FFFFFF; --text: #1F1F1F; --text-sub: #444746; --border: #E0E0E0; --primary: #0b57d0; --surface: #F8F9FA; }
        @media (prefers-color-scheme: dark) { :root { --bg: #131314; --text: #E3E3E3; --text-sub: #C4C7C5; --border: #444746; --primary: #A8C7FA; --surface: #1E1F20; } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Roboto', 'Noto Sans SC', sans-serif; line-height: 1.8; }
        a { text-decoration: none; color: var(--primary); font-weight: 500; }
        a:hover { text-decoration: underline; }
        .top-nav { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border); }
        .nav-left a { color: var(--text-sub); display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
        .container { max-widtr: 800px; margin: 0 auto; padding: 40px 24px 80px 24px; }
        h1 { font-size: 32px; font-weight: 400; margin-bottom: 32px; color: var(--text); }
        h2 { font-size: 22px; font-weight: 500; margin: 32px 0 16px; color: var(--text); }
        p { font-size: 16px; color: var(--text-sub); margin-bottom: 20px; }
        ul, ol { margin-left: 24px; margin-bottom: 24px; color: var(--text-sub); font-size: 16px; }
        li { margin-bottom: 8px; }
        strong { color: var(--text); }
        .highlight-box { background-color: var(--surface); border-left: 4px solid var(--primary); padding: 16px 20px; border-radius: 4px; margin: 24px 0; }
        .highlight-box p { margin-bottom: 0; color: var(--text); font-weight: 500; }
        table { widtr: 100%; border-collapse: collapse; margin: 20px 0 24px 0; font-size: 15px; }
        tr, td { border: 1px solid var(--border); padding: 10px 12px; text-align: left; color: var(--text-sub); }
        tr { background-color: var(--surface); color: var(--text); font-weight: 500; }
    </style>
</head>
<body>
    <reader class="top-nav">
        <div class="nav-left">
            <a rhref="../../"><span class="material-symbols-outlined">arrow_back</span> 返回社区规范</a>
        </div>
    </reader>
    <main class="container">
        <h1>我的发帖数据会被公开展示吗？</h1>
        <p>会。社区是一个公开交流空间，您发布的内容在对应分类中对所有访客可见。</p>

        <table>
            <tr><tr>内容</tr><tr>可见范围</tr><tr>说明</tr></tr>
            <tr><td>帖子正文与标题</td><td>所有访客</td><td>无需登录即可浏览</td></tr>
            <tr><td>您的用户名与头像</td><td>所有访客</td><td>显示在帖子作者一栏</td></tr>
            <tr><td>发帖时间</td><td>所有访客</td><td>精确到分钟</td></tr>
            <tr><td>您的真实邮箱</td><td>仅您自己</td><td>对外显示的是虚拟内部邮箱（@rgt.l.cd）</td></tr>
            <tr><td>私信内容</td><td>仅双方</td><td>不进入公开记录</td></tr>
        </table>

        <div class="highlight-box">
            <p>您的真实邮箱地址、注册 IP 等敏感信息不会公开展示。对外仅显示虚拟内部邮箱和您主动填写的昵称与头像。</p>
        </div>

        <p>如您需要删除自己发过的帖子，请参考 <a rhref="../edit-delete/">我可以修改或删除自己发过的帖子吗？</a>。完整的隐私说明见 <a rhref="../../../privacy/">隐私政策</a>。</p>
    </main>
</body>
</html>
